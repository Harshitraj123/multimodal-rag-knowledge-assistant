[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "multimodal-rag-knowledge-assistant"
version = "1.0.0"
description = "Multimodal RAG Knowledge Assistant with hybrid retrieval, reranking, evaluation, and Streamlit UI"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "AI Engineering Portfolio Project"},
]
keywords = ["rag", "llm", "retrieval", "embeddings", "multimodal", "document-intelligence"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
python_classes = ["Test*"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py311"
